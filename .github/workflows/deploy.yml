name: Deploy to VPS

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-vantages-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/aashishvinu/vantage
      IMAGE_TAG: ${{ github.ref_name }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -p "${VPS_PORT:-22}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Verify app directory exists
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "test -d '${VPS_APP_DIR}'"

      - name: Read build environment from VPS
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "cd '${VPS_APP_DIR}' && test -f docker.env && cat docker.env" > docker.env

      - name: Load build variables
        shell: bash
        run: |
          set -a
          . ./docker.env
          set +a
          {
            echo "VITE_SUPABASE_URL<<EOF"
            printf '%s\n' "${VITE_SUPABASE_URL}"
            echo "EOF"
            echo "VITE_SUPABASE_ANON_KEY<<EOF"
            printf '%s\n' "${VITE_SUPABASE_ANON_KEY}"
            echo "EOF"
            echo "VITE_GOOGLE_MAPS_API_KEY<<EOF"
            printf '%s\n' "${VITE_GOOGLE_MAPS_API_KEY}"
            echo "EOF"
            echo "VITE_RADAR_PUBLISHABLE_KEY<<EOF"
            printf '%s\n' "${VITE_RADAR_PUBLISHABLE_KEY}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ env.VITE_SUPABASE_ANON_KEY }}
            VITE_GOOGLE_MAPS_API_KEY=${{ env.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_RADAR_PUBLISHABLE_KEY=${{ env.VITE_RADAR_PUBLISHABLE_KEY }}

      - name: Pull latest code on VPS
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "cd '${VPS_APP_DIR}' && git pull"

      - name: Pull image and restart Docker app
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u '${{ secrets.GHCR_USER }}' --password-stdin && cd '${VPS_APP_DIR}' && VANTAGE_IMAGE='${IMAGE_NAME}:${IMAGE_TAG}' docker compose pull && VANTAGE_IMAGE='${IMAGE_NAME}:${IMAGE_TAG}' docker compose up -d"
